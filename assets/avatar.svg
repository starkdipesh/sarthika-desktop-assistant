  <!-- Left Headphone -->
  <rect x="33" y="52" width="7" height="15" rx="3.5" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5" />
  <!-- Right Headphone -->
  <rect x="88" y="52" width="7" height="15" rx="3.5" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5" />
  <!-- Headset Mic -->
  <path d="M88 64 Q85 80 72 82" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" />
  <circle cx="71" cy="82" r="2.5" fill="#ec4899" />
